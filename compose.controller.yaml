# Standalone Phase 3.1 MCP state; does not start Controller or any v2 service.
name: my-wfc-phase31
services:
  mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    env_file:
      - .runtime/controller-mcp.env
    environment:
      WFC_DB_PATH: /state/workflow.sqlite3
      WFC_MCP_HOST: 0.0.0.0
      WFC_POC_NO_AUTH: "0"
      WFC_GITHUB_APP_PEM: /run/.secret/coder-app.pem
    ports:
      - "127.0.0.1:18001:8000"
    volumes:
      - type: bind
        source: ./data/controller
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: ./.secret/coder-app.pem
        target: /run/.secret/coder-app.pem
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
