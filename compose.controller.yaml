# MCP + opt-in live local webhook. No automatic Controller/worker dispatch.
name: my-wfc-phase31
services:
  mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    env_file:
      - .runtime/controller-mcp.env
    environment:
      WFC_DB_PATH: /state/workflow.sqlite3
      WFC_MCP_HOST: 0.0.0.0
      WFC_PUBLIC_HOST: ${NGROK_DOMAIN:-caddy-reopen-scotch.ngrok-free.dev}
      WFC_POC_NO_AUTH: "0"
    ports:
      - "127.0.0.1:18001:8000"
    volumes:
      - type: bind
        source: ./data/controller
        target: /state
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
  webhook:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    command: ["python", "-m", "agent_workflow.integrations.webhook_http"]
    env_file:
      - .runtime/controller-webhook.env
    environment:
      WFC_WEBHOOK_DB_PATH: /state/workflow.sqlite3
      WFC_WEBHOOK_SECRET_FILE: /run/secret/controller-webhook-secret
      WFC_WEBHOOK_PORT: "8081"
    volumes:
      - type: bind
        source: ./data/controller
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: ./.secret/controller-webhook-secret
        target: /run/secret/controller-webhook-secret
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
  router:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on:
      - mcp
      - webhook
    volumes:
      - type: bind
        source: ./nginx/controller-router.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
  ngrok:
    image: ngrok/ngrok:3-alpine
    profiles:
      - tunnel
    env_file:
      - .runtime/ngrok.env
    command:
      - http
      - router:8080
      - --url
      - https://${NGROK_DOMAIN:-caddy-reopen-scotch.ngrok-free.dev}
    depends_on:
      - router
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
networks:
  default:
    ipam:
      config:
        - subnet: ${WFC_PHASE31_DOCKER_SUBNET:-10.254.241.0/24}
