# Standalone Phase 3.1 MCP state; does not start Controller or any v2 service.
name: my-wfc-phase31
services:
  mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    env_file:
      - .runtime/controller-mcp.env
    environment:
      WFC_DB_PATH: /state/workflow.sqlite3
      WFC_MCP_HOST: 0.0.0.0
      WFC_POC_NO_AUTH: "0"
    ports:
      - "127.0.0.1:18001:8000"
    volumes:
      - type: bind
        source: ./data/controller
        target: /state
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # Explicit opt-in: stop the existing POC ngrok tunnel before starting this one.
  # Routes the same reserved hostname to the Phase 3.1 MCP/Controller database.
  ngrok:
    image: ngrok/ngrok:3-alpine
    profiles:
      - tunnel
    env_file:
      - .runtime/ngrok.env
    command:
      - http
      - mcp:8000
      - --url
      - https://${NGROK_DOMAIN:-caddy-reopen-scotch.ngrok-free.dev}
    depends_on:
      - mcp
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

# Allocate a distinct subnet when Docker Desktop's default pools are exhausted.
# Must not overlap existing Docker networks, the host routing table or VPN routes.
# Existing techlead-review-poc MCP uses 10.254.240.0/24 by default.
networks:
  default:
    ipam:
      config:
        - subnet: ${WFC_PHASE31_DOCKER_SUBNET:-10.254.241.0/24}
