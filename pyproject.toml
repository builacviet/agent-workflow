[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow"
version = "0.2.0"
description = "Agent Workflow MCP, Controller and trusted GitHub worker"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]
mcp = ["mcp==1.30.0", "PyJWT[crypto]>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
agent_workflow = ["resources/*.md"]
"agent_workflow.storage" = ["schema.sql"]
