# Webhook never reaches MCP. OAuth discovery routes remain on MCP.
server {
  listen 8080;
  server_name _;
  client_max_body_size 1m;
  server_tokens off;
  # Docker embedded DNS resolves upstreams per request, even after a
  # sibling container is restarted with a different internal IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;
  set $webhook_upstream webhook:8081;
  set $mcp_upstream mcp:8000;
  location = /webhooks/github {
    limit_except POST { deny all; }
    proxy_pass http://$webhook_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
  }
  location / {
    proxy_pass http://$mcp_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}
