# Agent Workflow architecture import policy. Reviewed modifications require Owner/Tech Lead approval.
# Exact legacy edges are quarantined; never add wildcard exemptions.
version = 1

[forbidden_imports]
domain = ["agent_workflow.application", "agent_workflow.storage", "agent_workflow.integrations", "agent_workflow.runners", "agent_workflow.mcp", "agent_workflow.orchestration", "agent_workflow.infrastructure", "agent_workflow.interfaces", "agent_workflow.bootstrap", "agent_workflow.composition", "agent_workflow.paths", "coder_worker"]
application = ["agent_workflow.storage", "agent_workflow.integrations", "agent_workflow.runners", "agent_workflow.mcp", "agent_workflow.orchestration", "agent_workflow.infrastructure", "agent_workflow.interfaces", "agent_workflow.bootstrap", "agent_workflow.composition", "coder_worker"]
storage = ["agent_workflow.domain.service", "agent_workflow.integrations", "agent_workflow.runners", "agent_workflow.mcp", "agent_workflow.orchestration", "agent_workflow.composition", "coder_worker"]
integrations = ["agent_workflow.domain.service", "agent_workflow.storage", "agent_workflow.runners", "agent_workflow.mcp", "agent_workflow.orchestration", "agent_workflow.composition", "coder_worker"]
runners = ["agent_workflow.domain.service", "agent_workflow.storage", "agent_workflow.integrations", "agent_workflow.mcp", "agent_workflow.orchestration", "agent_workflow.composition", "coder_worker"]
mcp = ["agent_workflow.domain.service", "agent_workflow.storage", "agent_workflow.integrations", "agent_workflow.runners", "agent_workflow.orchestration", "agent_workflow.composition", "coder_worker"]
orchestration = ["agent_workflow.domain.service", "agent_workflow.storage", "agent_workflow.integrations", "agent_workflow.runners", "agent_workflow.mcp", "coder_worker"]
interfaces = ["agent_workflow.domain.service", "agent_workflow.storage", "agent_workflow.integrations", "agent_workflow.infrastructure", "agent_workflow.runners", "agent_workflow.orchestration", "agent_workflow.composition", "agent_workflow.bootstrap", "coder_worker"]
infrastructure = ["agent_workflow.mcp", "agent_workflow.interfaces", "agent_workflow.orchestration", "agent_workflow.composition", "agent_workflow.bootstrap", "coder_worker"]
coder_worker = ["agent_workflow.domain.service", "agent_workflow.storage", "agent_workflow.integrations", "agent_workflow.runners", "agent_workflow.mcp", "agent_workflow.orchestration", "agent_workflow.composition", "agent_workflow.bootstrap"]

[ownership]
"src/agent_workflow/domain/**" = "domain"
"src/agent_workflow/application/**" = "application"
"src/agent_workflow/infrastructure/**" = "infrastructure"
"src/agent_workflow/interfaces/**" = "interfaces"
"src/agent_workflow/bootstrap/**" = "bootstrap"
"src/agent_workflow/composition/**" = "bootstrap"
"src/agent_workflow/storage/**" = "persistence-legacy"
"src/agent_workflow/integrations/**" = "integration-legacy"
"src/agent_workflow/runners/**" = "runtime-legacy"
"src/agent_workflow/mcp/**" = "mcp-legacy"
"src/agent_workflow/orchestration/**" = "orchestration-legacy"
"src/coder_worker/**" = "trusted-worker"
"architecture/**" = "architecture-governance"
"docs/adr/AW-001-clean-architecture-governance.md" = "architecture-governance"

# The single accepted runner cycle is retired during R2; any additional cycle fails CI.
