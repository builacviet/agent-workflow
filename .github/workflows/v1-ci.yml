name: V1 CI

# A branch push runs against the actual commit SHA; pull_request also tests
# the synthetic merge result. The future Controller CI adapter must verify
# the exact PR head SHA and a successful named check, never a stale merge SHA.
on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: v1-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering ref
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Record tested SHA
        shell: bash
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Tested SHA: $(git rev-parse HEAD)"
          if [[ "${{ github.event_name }}" == 'push' ]]; then
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          else
            echo "PR HEAD (separate from merge SHA): ${{ github.event.pull_request.head.sha }}"
          fi

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,mcp,postgres,quality]'
          python -m pip check

      - name: Ruff lint and format check (changed Python only)
        env:
          RUFF_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUFF_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUFF_PUSH_BEFORE_SHA: ${{ github.event.before }}
          RUFF_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/ci_ruff_changed.py
      - name: Compile Python source and tests
        run: python -m compileall -q src tests alembic

      # The Compose parser test requires filenames declared by env_file,
      # but these are empty stubs; no production credentials are needed.
      - name: Prepare inert Compose env files (parse-only)
        run: |
          mkdir -p .runtime
          : > .runtime/controller-mcp.env
          : > .runtime/controller-webhook.env
          : > .runtime/ngrok.env

      - name: Enforce architecture import and cycle policy
        run: python -m pytest -q tests/test_architecture_policy.py

      - name: Run pytest
        run: python -m pytest -q


  postgres-migrations:
    name: PostgreSQL Alembic migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: workflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workflow_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PG_MIGRATOR_DSN: postgresql+psycopg://postgres:ci-local-only@127.0.0.1:5432/workflow_ci
      PG_TEST_DSN: postgresql+psycopg://postgres:ci-local-only@127.0.0.1:5432/workflow_ci
    steps:
      - name: Checkout exact triggering ref
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PostgreSQL migration and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,mcp,postgres]'
          python -m pip check

      - name: Apply Alembic baseline
        run: python -m alembic -c alembic.ini upgrade head

      - name: Check revision and PostgreSQL safety constraints
        run: python -m pytest -q tests/test_pg_migrations.py

      - name: Test PostgreSQL runtime connections
        run: python -m pytest -q tests/test_pg_connection.py

      - name: Verify rerunning head is idempotent
        run: python -m alembic -c alembic.ini upgrade head

  postgres-dev-compose:
    name: PostgreSQL dev Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<10'
      - name: Test isolated disposable Compose project
        run: python -m pytest -q tests/test_pg_dev_compose.py
        env:
          PG_DEV_LIVE_TEST: '1'
