name: V1 CI

# A branch push runs against the actual commit SHA; pull_request also tests
# the synthetic merge result. The future Controller CI adapter must verify
# the exact PR head SHA and a successful named check, never a stale merge SHA.
on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: v1-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Isolated CI-only database, never a project or production credential.
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: agent_workflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_workflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AGENT_WORKFLOW_TEST_POSTGRES_DSN: postgresql://postgres:ci-only-ephemeral@127.0.0.1:5432/agent_workflow
    steps:
      - name: Checkout exact triggering ref
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Record tested SHA
        shell: bash
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Tested SHA: $(git rev-parse HEAD)"
          if [[ "${{ github.event_name }}" == 'push' ]]; then
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          else
            echo "PR HEAD (separate from merge SHA): ${{ github.event.pull_request.head.sha }}"
          fi

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,mcp,postgres]'
          python -m pip check

      - name: Compile Python source and tests
        run: python -m compileall -q src tests

      # The Compose parser test requires filenames declared by env_file,
      # but these are empty stubs; no production credentials are needed.
      - name: Prepare inert Compose env files (parse-only)
        run: |
          mkdir -p .runtime
          : > .runtime/controller-mcp.env
          : > .runtime/controller-webhook.env
          : > .runtime/ngrok.env

      - name: Run pytest
        run: python -m pytest -q
